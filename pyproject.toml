[project]
name = "trdg"
version = "1.8.0"
description = "TextRecognitionDataGenerator: A synthetic data generator for text recognition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "arabic-reshaper>=3.0.0",
    "diffimg>=0.3.0",
    "numpy>=2.4.2",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.1.0",
    "python-bidi>=0.6.7",
    "requests>=2.32.5",
    "tqdm>=4.67.3",
    "wikipedia>=1.4.0",
]

[project.scripts]
trdg = "trdg.run:main"
trdg-doc = "trdg.run_doc:main"
